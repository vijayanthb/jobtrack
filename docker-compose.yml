services:
  postgres:
    image: postgres:16-alpine
    container_name: jobtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobtrack
    ports:
      - "5432:5432"
    volumes:
      - jobtrack-data:/var/lib/postgresql/data

volumes:
  jobtrack-data:
